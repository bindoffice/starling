[package]
name = "starling"
version = "0.1.0"
edition = "2024"
description = "A Rust implementation of an nginx-compatible web server and reverse proxy"
license = "Apache-2.0"

[[bin]]
name = "starling"
path = "src/main.rs"

[dependencies]
arc-swap = "1.9"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5"
fancy-regex = "0.16"
h2 = "0.4"
http = "1"
httpdate = "1.0"
flate2 = "1.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
libc = "0.2"
md-5 = "0.10"
openssl = "0.10"
percent-encoding = "2.3"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
regex = "1.12"
rustix = { version = "1.1", features = ["fs", "process", "stdio", "system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde_json = "1"
sha1 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wasmtime = { version = "51", default-features = false, features = ["async", "cranelift", "runtime", "std", "wat"] }
x509-parser = "0.18"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
tokio = { version = "1.54", features = ["full", "test-util"] }

[patch.crates-io]
h2 = { path = "vendor/h2" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

