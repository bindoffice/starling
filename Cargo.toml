[package]
name = "starling"
version = "0.1.0"
edition = "2024"
description = "A Rust implementation of an nginx-compatible web server and reverse proxy"
license = "BSD-2-Clause"

[[bin]]
name = "starling"
path = "src/main.rs"

[dependencies]
arc-swap = "1.9"
base64 = "0.22"
bytes = "1"
crc32fast = "1.5"
fancy-regex = "0.16"
h2 = "0.4"
http = "1"
httpdate = "1.0"
flate2 = "1.1"
libc = "0.2"
md-5 = "0.10"
openssl = "0.10"
percent-encoding = "2.3"
regex = "1.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
sha1 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"

[dev-dependencies]
tokio = { version = "1.54", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

