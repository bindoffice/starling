name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config zlib1g-dev
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config zlib1g-dev
      - run: cargo test --all-targets --locked

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      AR_x86_64_unknown_linux_musl: ar
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config
      - name: Build release binary
        run: cargo build --release --locked --features vendored-openssl --target x86_64-unknown-linux-musl
      - name: Verify release binary is static
        run: |
          binary="target/x86_64-unknown-linux-musl/release/starling"
          if readelf -d "$binary" | grep -Eq 'NEEDED'; then
            echo "release binary still has shared-library dependencies" >&2
            readelf -d "$binary" | grep -E 'NEEDED' >&2
            exit 1
          fi
          if objdump -T "$binary" | grep -q 'GLIBC_'; then
            echo "release binary still references glibc symbols" >&2
            exit 1
          fi
      - name: Build release archive
        run: scripts/package-release.sh --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: starling-ci-package
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7
