name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<Cargo.toml version>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        name: Resolve and validate version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          cargo_version="$(
            awk -F '"' '
              /^\[package\]/ { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ { print $2; exit }
            ' Cargo.toml
          )"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG:-v${cargo_version}}"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          fi

          version="${tag#v}"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "tag version ($version) does not match Cargo.toml version ($cargo_version)" >&2
            exit 1
          fi

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config zlib1g-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs:
      - prepare
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config zlib1g-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkgconf
          openssl_prefix="$(brew --prefix openssl@3)"
          echo "OPENSSL_DIR=$openssl_prefix" >>"$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >>"$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >>"$GITHUB_ENV"
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          $opensslDir = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows-static-md"
          "OPENSSL_DIR=$opensslDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Linux release binary
        if: runner.os == 'Linux'
        run: cargo build --release --locked --features vendored-openssl --target "${{ matrix.target }}"
      - name: Verify OpenSSL is statically linked
        if: runner.os == 'Linux'
        run: |
          if readelf -d "target/${{ matrix.target }}/release/starling" | grep -Eq 'NEEDED.*lib(ssl|crypto)'; then
            echo "release binary still depends on shared OpenSSL libraries" >&2
            exit 1
          fi
      - name: Build macOS/Windows release binary
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package release archive
        shell: bash
        run: |
          scripts/package-release.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --output-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum >SHA256SUMS
          cat SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(
            find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0
          )
          assets+=(dist/SHA256SUMS)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Starling $VERSION" \
              --generate-notes
          fi
